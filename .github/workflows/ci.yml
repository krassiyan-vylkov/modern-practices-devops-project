name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest

    - name: Run Black (format check)
      run: |
        black --check app/
        
    - name: Lint with flake8
      uses: py-actions/flake8@v2
      with:
        ignore: "B008"
        max-line-length: "100"
        plugins: "flake8-bugbear==22.1.11 flake8-black"
    
    - name: Perform Bandit Analysis
      uses: PyCQA/bandit-action@v1

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
  docker:
    needs: CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/arknights-app:latest \
                     -t ${{ secrets.DOCKERHUB_USERNAME }}/arknights-app:${{ github.sha }} .
    
    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/arknights-app:latest
        format: table
        exit-code: 1
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: CRITICAL,HIGH

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/arknights-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/arknights-app:${{ github.sha }}
