apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-migrations
data:
  V1__create_tables.sql: |
    CREATE TABLE IF NOT EXISTS public.operators (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        attack INTEGER NOT NULL,
        damage_type TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS public.bosses (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        defense INTEGER NOT NULL,
        resistance INTEGER NOT NULL
    );

  V2__seed_initial_data.sql: |
    INSERT INTO public.operators (name, attack, damage_type) VALUES
    ('Exusiai', 650, 'physical'),
    ('SilverAsh', 900, 'physical'),
    ('Eyjafjalla', 800, 'arts'),
    ('Surtr', 2000, 'arts'),
    ('Mlynar', 1800, 'physical'),
    ('Mons3r', 1200, 'true'),
    ('Saga', 1000, 'physical'),
    ('Bubble', 300, 'physical');

    INSERT INTO public.bosses (name, defense, resistance) VALUES
    ('Patriot', 1200, 50),
    ('FrostNova', 600, 70),
    ('Crownslayer', 400, 20),
    ('Last Steam Knight', 2000, 10),
    ('Minimalist', 200, 40),
    ('Pompeii', 200, 80),
    ('Mechanist', 1400, 50);

  V3__add_more_data.sql: |
    INSERT INTO public.operators (name, attack, damage_type) VALUES
    ('Texas', 750, 'physical'),
    ('Bagpipe', 1100, 'physical'),
    ('Ifrit', 950, 'arts'),
    ('Ceobe', 870, 'arts'),
    ('Kal''tsit', 1300, 'true');

    INSERT INTO public.bosses (name, defense, resistance) VALUES
    ('Talulah', 1800, 60),
    ('Mephisto', 300, 90),
    ('Skullshatterer', 700, 25);

  V4__add_more_operators.sql: |
    INSERT INTO public.operators (name, attack, damage_type) VALUES
    ('Lappland', 720, 'physical'),
    ('Blaze', 1100, 'physical');
