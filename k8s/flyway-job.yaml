apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:10
          args:
            - migrate
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://postgres:5432/arknights
            - name: FLYWAY_USER
              value: arknights
            - name: FLYWAY_PASSWORD
              value: arknights
            - name: FLYWAY_LOCATIONS
              value: filesystem:/flyway/sql
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_BASELINE_VERSION
              value: "2"
          volumeMounts:
            - name: flyway-migrations
              mountPath: /flyway/sql
      volumes:
        - name: flyway-migrations
          configMap:
            name: flyway-migrations
